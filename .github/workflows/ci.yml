name: Validate FANTAMONITOR
on:
  # Su tutti i branch, non solo su main: il filtro precedente lasciava scoperti i branch di
  # lavoro, e un package-lock.json fuori sync è rimasto lì sei commit prima che Vercel lo
  # scoprisse al posto nostro. `npm ci` qui sotto è il controllo che lo intercetta.
  push:
  pull_request:
permissions:
  contents: read
# Un push che ne supera un altro sullo stesso branch annulla il run precedente; su main si
# lascia finire, perché lì il risultato di ogni commit conta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test prototype/tests/collector.test.mjs
      - run: npm test
      # Il connettore non ha dipendenze da installare per questi test: sono le sue
      # funzioni pure, senza Playwright.
      - run: node --test connector/tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
        working-directory: prototype
      - run: npm run build
